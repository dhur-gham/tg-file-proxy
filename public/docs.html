<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram File Proxy — API Docs</title>
  <meta name="description" content="OpenAPI documentation for the Telegram File Proxy API" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* Top nav */
    .topbar {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-logo { font-size: 22px; }
    .topbar-title { font-size: 16px; font-weight: 700; color: #e6edf3; }
    .topbar-title span { color: #58a6ff; }
    .topbar-links { display: flex; gap: 12px; align-items: center; }
    .topbar-links a {
      font-size: 13px; color: #8b949e; text-decoration: none;
      padding: 6px 12px; border-radius: 6px; border: 1px solid #30363d;
      transition: background .15s, color .15s;
    }
    .topbar-links a:hover { background: #21262d; color: #e6edf3; }
    .topbar-links a.primary {
      background: #238636; border-color: #238636; color: #fff;
    }
    .topbar-links a.primary:hover { background: #2ea043; }

    /* Swagger UI overrides */
    #swagger-ui {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .swagger-ui { background: transparent !important; }
    .swagger-ui .info { margin-bottom: 32px; }
    .swagger-ui .info .title { color: #e6edf3 !important; font-size: 28px !important; }
    .swagger-ui .info .description p { color: #8b949e !important; }
    .swagger-ui .info .version { background: #238636 !important; }

    .swagger-ui .scheme-container {
      background: #161b22 !important;
      border: 1px solid #30363d !important;
      border-radius: 8px !important;
      padding: 16px !important;
      box-shadow: none !important;
    }

    .swagger-ui select {
      background: #0d1117 !important;
      color: #e6edf3 !important;
      border: 1px solid #30363d !important;
      border-radius: 6px !important;
    }

    .swagger-ui .opblock-tag {
      color: #e6edf3 !important;
      border-bottom: 1px solid #30363d !important;
      font-size: 18px !important;
    }
    .swagger-ui .opblock-tag:hover { background: #161b22 !important; }

    .swagger-ui .opblock {
      background: #161b22 !important;
      border: 1px solid #30363d !important;
      border-radius: 8px !important;
      margin-bottom: 12px !important;
      box-shadow: none !important;
    }
    .swagger-ui .opblock .opblock-summary {
      border-bottom: none !important;
      border-radius: 8px !important;
    }
    .swagger-ui .opblock.is-open .opblock-summary {
      border-bottom: 1px solid #30363d !important;
      border-radius: 8px 8px 0 0 !important;
    }
    .swagger-ui .opblock-summary-path { color: #e6edf3 !important; font-size: 14px !important; }
    .swagger-ui .opblock-summary-description { color: #8b949e !important; }

    /* HTTP method badges */
    .swagger-ui .opblock-summary-method {
      border-radius: 6px !important;
      font-size: 12px !important;
      min-width: 70px !important;
      text-align: center !important;
    }
    .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #1f6feb !important; }
    .swagger-ui .opblock.opblock-get  .opblock-summary-method { background: #238636 !important; }

    .swagger-ui .opblock-body-inner { background: #0d1117 !important; }
    .swagger-ui .opblock-description-wrapper p,
    .swagger-ui .opblock-external-docs-wrapper p,
    .swagger-ui .opblock-section-header h4,
    .swagger-ui table thead tr th,
    .swagger-ui .parameter__name,
    .swagger-ui .parameter__type,
    .swagger-ui .parameter__in,
    .swagger-ui .col_header { color: #e6edf3 !important; }

    .swagger-ui .parameter__name.required::after { color: #f85149 !important; }

    .swagger-ui textarea,
    .swagger-ui input[type=text],
    .swagger-ui input[type=email],
    .swagger-ui input[type=file],
    .swagger-ui input[type=password] {
      background: #0d1117 !important;
      color: #e6edf3 !important;
      border: 1px solid #30363d !important;
      border-radius: 6px !important;
    }

    .swagger-ui .btn { border-radius: 6px !important; }
    .swagger-ui .btn.execute {
      background: #238636 !important;
      border-color: #238636 !important;
      color: #fff !important;
    }
    .swagger-ui .btn.execute:hover { background: #2ea043 !important; }
    .swagger-ui .btn.cancel { border-color: #f85149 !important; color: #f85149 !important; }

    .swagger-ui .response-col_status { color: #3fb950 !important; }
    .swagger-ui .response-col_description { color: #8b949e !important; }
    .swagger-ui .responses-inner { background: #0d1117 !important; }
    .swagger-ui .microlight { background: #161b22 !important; color: #e6edf3 !important; border-radius: 6px !important; padding: 12px !important; }
    .swagger-ui .model-box { background: #161b22 !important; border-radius: 6px !important; }
    .swagger-ui .model { color: #e6edf3 !important; }
    .swagger-ui .prop-type { color: #58a6ff !important; }
    .swagger-ui .prop-format { color: #8b949e !important; }
    .swagger-ui section.models { background: #161b22 !important; border: 1px solid #30363d !important; border-radius: 8px !important; }
    .swagger-ui section.models h4 { color: #e6edf3 !important; }
    .swagger-ui .model-title { color: #e6edf3 !important; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 13px;
      color: #484f58;
      border-top: 1px solid #21262d;
      margin-top: 32px;
    }
    footer a { color: #58a6ff; text-decoration: none; font-weight: 500; }
    footer a:hover { text-decoration: underline; }

    /* Hide default swagger topbar */
    .swagger-ui .topbar { display: none !important; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">✈️</span>
      <span class="topbar-title">Telegram File Proxy <span>/ API Docs</span></span>
    </div>
    <div class="topbar-links">
      <a href="/">← App</a>
      <a href="/openapi.json">openapi.json</a>
      <a href="https://github.com/dhur-gham/tg-file-proxy" target="_blank">GitHub</a>
      <a href="/" class="primary">Live API</a>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <footer>
    Built by <a href="https://dhurgham.dev" target="_blank">dhurgham.dev</a>
  </footer>

  <script>
    window.onload = async () => {
      // Always advertise the host the user is actually on
      let spec;
      try {
        spec = await (await fetch('/openapi.json')).json();
        spec.servers = [{ url: location.origin, description: 'Current host' }];
      } catch (e) {
        spec = null;
      }

      SwaggerUIBundle({
        ...(spec ? { spec } : { url: '/openapi.json' }),
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
        layout: 'BaseLayout',
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 2,
        tryItOutEnabled: true,
        requestSnippetsEnabled: true,
      });
    };
  </script>
</body>
</html>
